name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, only the newest deploy finishes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches typos before they reach the live site.
      - name: Check JavaScript syntax
        run: |
          for f in src/js/*.js; do
            node --input-type=module --check < "$f" || { echo "Syntax error in $f"; exit 1; }
          done

      # Publish only what the site needs (not the README, workflows, etc.).
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/src
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
